<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Next-Gen Age Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">Next Gen Age Calculator</div>
      <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <div class="container">

    <h1>Contact Us</h1>
    <p class="subtitle">Have a question or suggestion? Send us a message.</p>

    <div class="card">
      <form action="https://formsubmit.co/imadulhaque815@gmail.com" method="POST" class="contact-form">

        <!-- Name -->
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>

        <!-- Email -->
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>

        <!-- Message -->
        <label for="message">Your Message</label>
        <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>

        <!-- Hidden FormSubmit settings -->
        <input type="hidden" name="_captcha" value="false">

        <button type="submit">Send Message</button>
      </form>
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    © 2026 Next-Gen Age Calculator. All rights reserved. |
    <a href="about.html">About</a> |
    <a href="privacy.html">Privacy</a> |
    <a href="terms.html">Terms</a> |
    <a href="contact.html">Contact</a>
  </footer>

</body>
</html>
